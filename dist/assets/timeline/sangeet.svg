    <g stroke="#c5a059" stroke-width="0.8" opacity="0.75" fill="#f5ede0">
      <ellipse cx="60" cy="62" rx="26" ry="10" fill="none"/>
      <ellipse cx="60" cy="62" rx="26" ry="19" fill="none"/>
      <ellipse cx="60" cy="62" rx="10" ry="26" fill="none"/>
      <ellipse cx="60" cy="62" rx="19" ry="26" fill="none"/>
      <line x1="34" y1="62" x2="86" y2="62"/>
    </g>
    <!-- Facet glints -->
    <rect x="52" y="54" width="4" height="4" fill="#ffffff" opacity="0.9"/>
    <rect x="64" y="60" width="4" height="4" fill="#ffffff" opacity="0.9"/>
    <rect x="58" y="68" width="4" height="4" fill="#ffffff" opacity="0.9"/>
