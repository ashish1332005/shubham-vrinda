<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
      <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#faf5ea" stop-opacity="0.9"/>
        <stop offset="70%" stop-color="#faebd7" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#faebd7" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d4af37"/>
        <stop offset="50%" stop-color="#f3e5ab"/>
        <stop offset="100%" stop-color="#b8860b"/>
      </linearGradient>
    </defs>
    <circle cx="60" cy="60" r="54" fill="url(#starGlow)"/>
    <!-- Hanging Chain -->
    <line x1="60" y1="12" x2="60" y2="34" stroke="#c5a059" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="60" cy="34" r="3" fill="#b8860b"/>
    <!-- Disco Ball -->
    <circle cx="60" cy="62" r="26" fill="#fdfbf7" stroke="#b8860b" stroke-width="1"/>
