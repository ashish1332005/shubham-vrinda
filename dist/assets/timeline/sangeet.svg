    <path d="M38,44 C30,48 30,66 38,72" fill="none" stroke="#697f59" stroke-width="1.5"/>
    <circle cx="32" cy="50" r="3" fill="#697f59"/>
    <circle cx="30" cy="60" r="3" fill="#697f59"/>
    <circle cx="34" cy="70" r="3" fill="#697f59"/>
